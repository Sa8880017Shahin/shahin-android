plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shahin.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.shahin.ai"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }
    }
}
